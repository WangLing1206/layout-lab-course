<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Layout Lab">
  <title>布局实验室 · Layout Lab</title>
  <!-- 图标本身就是一份版面：一条通栏页头、一条左侧栏、一块主内容 -->
  <style>
    .bg { fill: #1f6b64; }
    .fg { fill: #ffffff; }
    .mid { fill: #ffffff; opacity: .72; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #10171a; }
      .fg { fill: #6cc6bb; }
      .mid { fill: #6cc6bb; opacity: .6; }
    }
  </style>
  <rect class="bg" width="32" height="32" rx="7"/>
  <rect class="fg"  x="7" y="7"  width="18" height="4" rx="1.4"/>
  <rect class="fg"  x="7" y="13" width="5"  height="12" rx="1.4"/>
  <rect class="mid" x="14.5" y="13" width="10.5" height="12" rx="1.4"/>
</svg>
